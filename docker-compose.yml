name: document-pipeline

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents}
      POSTGRES_USER: ${POSTGRES_USER:-documents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documents}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documents} -d ${POSTGRES_DB:-documents}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: sh /app/entrypoint.sh
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_ROOT: /media
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: python manage.py run_worker
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEDIA_ROOT: /media
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media: